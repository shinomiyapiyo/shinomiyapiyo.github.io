function dI(img,x,y,s){if(img&&img.complete&&img.naturalWidth)X.drawImage(img,x-s/2,y-s/2,s,s)}
// Rounded rect path helper (with fallback for older WebViews)
function rrPath(x,y,w,h,r){X.beginPath();if(X.roundRect){X.roundRect(x,y,w,h,r)}else{X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y)}X.closePath()}
// Shared button renderer: filled gradient + white text (pill-shaped)
function dBtn(bx,by,bw,bh,label,color,icon,opts){
  opts=opts||{};
  const r=opts.round!=null?opts.round:bh/2;
  const fs=opts.fontSize||15;
  const lw=opts.lineWidth!=null?opts.lineWidth:1.5;
  const iSz=opts.iconSize||18;
  const dark=opts.dark||false;
  // Parse hex color to RGB
  const hx=color.replace('#',''),cr=parseInt(hx.substring(0,2),16)||128,cg=parseInt(hx.substring(2,4),16)||128,cb=parseInt(hx.substring(4,6),16)||128;
  if(opts.outline){
    // Outline style for dialogs
    rrPath(bx,by,bw,bh,r);
    X.fillStyle=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.03)';X.fill();
    rrPath(bx,by,bw,bh,r);X.strokeStyle=color;X.lineWidth=lw;X.stroke();
    X.fillStyle=color;X.font=`bold ${fs}px sans-serif`;X.textAlign='center';
    if(icon)dI(icon,bx+bw/2-X.measureText(label).width/2-12,by+bh/2+1,iSz);
    X.fillText(label,bx+bw/2,by+bh/2+5);
    return;
  }
  // Filled gradient background
  const bg=X.createLinearGradient(bx,by,bx,by+bh);
  bg.addColorStop(0,`rgba(${Math.min(255,cr+40)},${Math.min(255,cg+40)},${Math.min(255,cb+40)},0.92)`);
  bg.addColorStop(1,`rgba(${Math.max(0,cr-30)},${Math.max(0,cg-30)},${Math.max(0,cb-30)},0.92)`);
  rrPath(bx,by,bw,bh,r);X.fillStyle=bg;X.fill();
  // Border (darker shade)
  rrPath(bx,by,bw,bh,r);X.strokeStyle=`rgba(${Math.max(0,cr-50)},${Math.max(0,cg-50)},${Math.max(0,cb-50)},0.6)`;X.lineWidth=lw;X.stroke();
  // Top highlight line
  if(bh>20){rrPath(bx+1,by+1,bw-2,bh/2,r);X.strokeStyle=`rgba(255,255,255,0.18)`;X.lineWidth=0.5;X.stroke()}
  // Disabled overlay
  if(opts.disabled){X.save();X.globalAlpha=0.4}
  // Rich text: outline + emboss highlight + gradient fill
  X.save();
  X.font=`bold ${fs}px sans-serif`;X.textAlign='center';
  const tx=bx+bw/2,ty=by+bh/2+5;
  if(opts.iconOnly){
    X.shadowColor='rgba(0,0,0,0.4)';X.shadowBlur=3;X.shadowOffsetY=1;
    if(icon)dI(icon,bx+bw/2,by+bh/2,iSz);
  }else{
    const tw=X.measureText(label).width;
    if(icon)dI(icon,tx-tw/2-12,by+bh/2+1,iSz);
    // Dark outline for depth
    X.strokeStyle=`rgba(${Math.max(0,cr-60)},${Math.max(0,cg-60)},${Math.max(0,cb-60)},0.5)`;X.lineWidth=3;X.lineJoin='round';X.strokeText(label,tx,ty);
    // Emboss: top highlight
    X.fillStyle='rgba(255,255,255,0.25)';X.fillText(label,tx,ty-0.8);
    // Gradient fill: white top → slight gray bottom
    const tg=X.createLinearGradient(0,ty-fs*0.7,0,ty+2);
    tg.addColorStop(0,'#FFFFFF');tg.addColorStop(1,'#D8D8D8');
    X.fillStyle=tg;
    X.shadowColor='rgba(0,0,0,0.35)';X.shadowBlur=2;X.shadowOffsetY=1;
    X.fillText(label,tx,ty);
  }
  X.restore();
  if(opts.disabled){X.restore()}
}

// Pre-generate red-tinted sprites for runnerPiyo (avoid runtime creation & memory leak)
const RED_SPR={};
function initRedSprites(){
  const keys=['walk_0','stand','walk_2'];
  keys.forEach(k=>{
    if(RED_SPR[k])return;
    const img=SPR[k];
    function tryGen(){
      if(!img.complete||!img.naturalWidth||!img.naturalHeight)return;
      try{
        const oc=document.createElement('canvas');
        oc.width=img.naturalWidth;oc.height=img.naturalHeight;
        const ox=oc.getContext('2d');
        ox.drawImage(img,0,0);
        const id=ox.getImageData(0,0,oc.width,oc.height);
        const d=id.data;
        for(let p=0;p<d.length;p+=4){
          if(d[p+3]<10)continue;
          d[p]=Math.min(255,d[p]+60);
          d[p+1]=Math.max(0,d[p+1]-70);
          d[p+2]=Math.min(255,d[p+2]+10);
        }
        ox.putImageData(id,0,0);
        RED_SPR[k]=oc;
      }catch(e){console.warn('[14b:sprite]',e)}
    }
    if(img.complete&&img.naturalWidth)tryGen();
    else img.addEventListener('load',tryGen,{once:true});
  });
}
initRedSprites();
window.addEventListener('load',()=>{if(Object.keys(RED_SPR).length<3)initRedSprites()});

// === Web Audio API for SE ===
let actx=null;
const seBufs={};
let seLoaded=false;

function ensureACtx(){
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  }
  if(actx.state==='suspended'||actx.state==='interrupted'){
    try{actx.resume()}catch(e){console.warn('[14b:audio]',e)}
  }
  return actx;
}

async function fetchAudioSafe(url){
  // Try fetch first (works on http/https), then XHR (works on file:// in some browsers)
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error(res.status);
    return res.arrayBuffer();
  }catch(e){console.warn('[14b:fetch]',e)}
  return new Promise((resolve,reject)=>{
    try{
      const xhr=new XMLHttpRequest();
      xhr.open('GET',url,true);xhr.responseType='arraybuffer';
      xhr.onload=()=>{if(xhr.response&&xhr.response.byteLength>0)resolve(xhr.response);else reject(new Error('XHR empty'))};
      xhr.onerror=()=>reject(new Error('XHR failed: '+url));
      xhr.send();
    }catch(e2){reject(e2)}
  });
}
let seLoadAttempts=0;
async function loadAllSE(){
  if(seLoaded)return;
  const ac=ensureACtx();if(!ac)return;
  seLoadAttempts++;
  try{
    const [goArr,missArr,quakeArr,heartArr]=await Promise.all([fetchAudioSafe('audio/se/go.mp3'),fetchAudioSafe('audio/se/miss.mp3'),fetchAudioSafe('audio/se/quake.mp3'),fetchAudioSafe('audio/se/heart.mp3')]);
    seBufs['go']=await ac.decodeAudioData(goArr);
    seBufs['miss']=await ac.decodeAudioData(missArr);
    seBufs['quake']=await ac.decodeAudioData(quakeArr);
    seBufs['heart']=await ac.decodeAudioData(heartArr);
    // Synthesize foghorn SE (eerie low horn)
    const fRate=ac.sampleRate;
    const fLen=2.0,fFrames=fLen*fRate;
    const fBuf=ac.createBuffer(1,fFrames,fRate);const fD=fBuf.getChannelData(0);
    for(let i=0;i<fFrames;i++){const t=i/fRate;const env=Math.min(t*2,1)*Math.max(0,1-t/fLen);fD[i]=env*(Math.sin(t*55*Math.PI*2)*0.3+Math.sin(t*82.5*Math.PI*2)*0.15+Math.sin(t*110*Math.PI*2)*0.1)*0.8}
    seBufs['foghorn']=fBuf;
    seLoaded=true;
  }catch(e){
    seLoaded=false;
    if(seLoadAttempts<3){setTimeout(loadAllSE,1000*seLoadAttempts)}
    else{
      seFallback=true;seLoaded=true;
    }
  }
}

// === SE PLAYBACK ===
const seGoSrc='go';const seMissSrc='miss';
const seVols={'go':0.3,'miss':0.7,'quake':0.20,'foghorn':0.3,'heart':0.5};
const seFiles={'go':'audio/se/go.mp3','miss':'audio/se/miss.mp3','quake':'audio/se/quake.mp3','heart':'audio/se/heart.mp3'};
let seFallback=false;
const seFbPool={};// Audio element pool for fallback mode (prevent DOM leak)
// Track active quake SE source so it can be stopped on block transition
let quakeSrc=null;let quakeAudioFb=null;
function playSe(id){
  if(audioMuted)return;
  if(!seLoaded){loadAllSE();return}
  // Fallback mode: use Audio element pool (prevent DOM leak)
  if(seFallback){
    const file=seFiles[id];if(!file)return;
    if(!seFbPool[id]){seFbPool[id]=new Audio(file)}
    const a=seFbPool[id];
    a.volume=seVols[id]||0.3;
    a.currentTime=0;
    a.play().catch(e=>console.warn('[14b:audio]',e));
    if(id==='quake'){if(quakeAudioFb&&quakeAudioFb!==a){try{quakeAudioFb.pause()}catch(e){console.warn('[14b:audio]',e)}}quakeAudioFb=a;a.onended=()=>{if(quakeAudioFb===a)quakeAudioFb=null}}
    return;
  }
  const ac=ensureACtx();if(!ac)return;
  const buf=seBufs[id];if(!buf)return;
  function doPlay(){
    try{
      const src=ac.createBufferSource();
      const gain=ac.createGain();
      src.buffer=buf;
      gain.gain.value=seVols[id]||0.3;
      src.connect(gain);gain.connect(ac.destination);
      src.start(0);
      if(id==='quake'){
        if(quakeSrc){try{quakeSrc.stop()}catch(e){console.warn('[14b:audio]',e)}}
        quakeSrc=src;
        src.onended=()=>{if(quakeSrc===src)quakeSrc=null};
      }
    }catch(e){console.warn('[14b:audio]',e)}
  }
  if(ac.state==='running'){doPlay()}
  else{try{ac.resume().then(()=>doPlay()).catch(e=>console.warn('[14b:audio]',e))}catch(e){doPlay()}}
}
function stopQuakeSe(){
  if(quakeSrc){try{quakeSrc.stop()}catch(e){console.warn('[14b:audio]',e)}quakeSrc=null}
  if(quakeAudioFb){try{quakeAudioFb.pause()}catch(e){console.warn('[14b:audio]',e)}quakeAudioFb=null}
}

const EASY_AN=[1,2,3,4,6,7,8,9,10,11,12,14,15,17,18,19,20,21,22,23,24,26,34,37,38,39];
function genA(){
  BW=BW_NORMAL;runnerActive=false;
  if(gameMode==='normal'){
    if(cB<=1||cB>=14){hasA=false;return}
    hasA=Math.random()<0.70;
  }else if(gameMode==='easy'){
    if(cB<=1||cB>=14){hasA=false;return}
    hasA=Math.random()<0.70;
  }else if(gameMode==='complete'){
    if(cB<=1){hasA=false;return}
    hasA=Math.random()<0.80;
  }else{
    if(cB<=1){hasA=false;return}
    // Challenge: base 50%, +5% each consecutive no-anomaly block, reset on anomaly
    hasA=Math.random()<chAnomRate;
    if(hasA){chAnomRate=0.50}else{chAnomRate=Math.min(chAnomRate+0.05,1.0)}
  }
  if(hasA){
    if(gameMode==='easy'){
      // イージーは固定の易しいプールから（既出除外なし＝重複OK）
      aT=EASY_AN[Math.floor(Math.random()*EASY_AN.length)];
    }else if(gameMode==='normal'||gameMode==='complete'){
      // Exclude already-cleared anomalies
      const available=[];
      for(let i=0;i<AN.length;i++){if(!clearedAnomalies.includes(AN[i]))available.push(i)}
      if(available.length===0){hasA=false;return}// All anomalies cleared
      aT=available[Math.floor(Math.random()*available.length)];
    }else{
      aT=Math.floor(Math.random()*AN.length);
    }
    const ifn=ANOM_INIT[AN[aT]];if(ifn)ifn();
  }
  // Heart item drop (complete mode only, 1/15 chance, not on block 1)

function dTkyTower(){
  if(!(hasA&&AN[aT]==='tokyoTower'))return;
  const gy=H*GH;
  const tx=W*0.52;
  const tBase=gy;
  const tH=H*0.58;
  const tTop=tBase-tH;
  const tW=tH*0.11;
  // Tower shadow/glow
  const sg=X.createLinearGradient(tx-tW*2,0,tx+tW*2,0);
  sg.addColorStop(0,'transparent');
  sg.addColorStop(0.3,'rgba(120,20,15,0.06)');
  sg.addColorStop(0.5,'rgba(120,20,15,0.1)');
  sg.addColorStop(0.7,'rgba(120,20,15,0.06)');
  sg.addColorStop(1,'transparent');
  X.fillStyle=sg;X.fillRect(tx-tW*3,tTop,tW*6,tH);
  // Main tower body - tapered shape
  X.beginPath();
  X.moveTo(tx-1,tTop);
  X.lineTo(tx-tW*0.3,tBase-tH*0.7);
  X.lineTo(tx-tW*0.55,tBase-tH*0.5);
  X.lineTo(tx-tW*0.7,tBase-tH*0.35);
  X.lineTo(tx-tW,tBase);
  X.lineTo(tx+tW,tBase);
  X.lineTo(tx+tW*0.7,tBase-tH*0.35);
  X.lineTo(tx+tW*0.55,tBase-tH*0.5);
  X.lineTo(tx+tW*0.3,tBase-tH*0.7);
  X.lineTo(tx+1,tTop);
  X.closePath();
  const tg=X.createLinearGradient(tx-tW,0,tx+tW,0);
  tg.addColorStop(0,'rgba(100,25,18,0.35)');
  tg.addColorStop(0.3,'rgba(130,38,28,0.42)');
  tg.addColorStop(0.5,'rgba(145,45,32,0.45)');
  tg.addColorStop(0.7,'rgba(130,38,28,0.42)');
  tg.addColorStop(1,'rgba(100,25,18,0.35)');
  X.fillStyle=tg;X.fill();
  // Red-white stripes
  const stripeCount=7;
  for(let i=0;i<stripeCount;i++){
    const ratio=i/stripeCount;
    const sy=tTop+tH*ratio;
    const nextSy=tTop+tH*((i+1)/stripeCount);
    const wAt=tW*(0.05+ratio*0.95);
    const nwAt=tW*(0.05+((i+1)/stripeCount)*0.95);
    if(i%2===0){
      X.fillStyle='rgba(140,35,25,0.35)';
    }else{
      X.fillStyle='rgba(140,120,115,0.2)';
    }
    X.beginPath();
    X.moveTo(tx-wAt,sy);X.lineTo(tx+wAt,sy);
    X.lineTo(tx+nwAt,nextSy);X.lineTo(tx-nwAt,nextSy);
    X.closePath();X.fill();
  }
  // Upper observation deck
  const deckY1=tBase-tH*0.52;
  const deckW1=tW*0.75;
  X.fillStyle='rgba(120,38,30,0.4)';
  X.fillRect(tx-deckW1,deckY1-2,deckW1*2,5);
  X.fillStyle='rgba(80,25,20,0.3)';
  X.fillRect(tx-deckW1*0.85,deckY1-6,deckW1*1.7,4);
  // Lower observation deck
  const deckY2=tBase-tH*0.35;
  const deckW2=tW*0.9;
  X.fillStyle='rgba(120,38,30,0.4)';
  X.fillRect(tx-deckW2,deckY2-2,deckW2*2,6);
  X.fillStyle='rgba(80,25,20,0.3)';
  X.fillRect(tx-deckW2*0.85,deckY2-7,deckW2*1.7,5);
  // Antenna
  X.fillStyle='rgba(120,40,32,0.4)';
  X.fillRect(tx-1,tTop-tH*0.12,2,tH*0.12);
  // Blinking red light on top
  if(Math.sin(fc*0.1)>0){
    const ly=tTop-tH*0.12;
    X.fillStyle='rgba(255,0,0,0.9)';X.beginPath();X.arc(tx,ly,3,0,Math.PI*2);X.fill();
    const lg=X.createRadialGradient(tx,ly,0,tx,ly,25);
    lg.addColorStop(0,'rgba(255,0,0,0.35)');lg.addColorStop(1,'transparent');
    X.fillStyle=lg;X.beginPath();X.arc(tx,ly,25,0,Math.PI*2);X.fill();
  }
  // Small lights on observation decks
  if(Math.sin(fc*0.15+1)>0.3){
    X.fillStyle='rgba(255,100,50,0.6)';
    X.beginPath();X.arc(tx-deckW1+3,deckY1-1,1.5,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(tx+deckW1-3,deckY1-1,1.5,0,Math.PI*2);X.fill();
  }
  if(Math.sin(fc*0.12+2)>0.3){
    X.fillStyle='rgba(255,100,50,0.6)';
    X.beginPath();X.arc(tx-deckW2+3,deckY2-1,1.5,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(tx+deckW2-3,deckY2-1,1.5,0,Math.PI*2);X.fill();
  }
}

    const pauseIcns=[ICN.play,ICN.sound,null];
    for(let i=0;i<3;i++){
      const bx=W/2-btnW/2,by=panY+72+i*52;
      pauseBtns.push({x:bx,y:by,w:btnW,h:btnH,id:i===2?1:i===1?20:0});
      dBtn(bx,by,btnW,btnH,labels[i][0],labels[i][1],pauseIcns[i],{dark:true});

}

function handlePauseTap(cx,cy){
  for(const b of pauseBtns){
    if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){
      if(b.id===0){gs='playing';retireConfirm=false;return true}// Resume
      if(b.id===20){toggleMute();return true}// Mute toggle
      if(b.id===1){retireConfirm=true;return true}// Show retire confirmation
      if(b.id===10){retireConfirm=false;if(gameMode==='challenge'){challengeScore=cB;showNameEntry=isRankIn(challengeScore);nameInput='';nameInputActive=showNameEntry;gs='gameover';stopBgm();playBgm(bgmDeath)}else{gs='title';playBgm(bgmTitle)}return true}// Confirm retire
      if(b.id===11){retireConfirm=false;return true}// Cancel retire
    }
  }
  return false;
}

function hitPauseBtn(cx,cy){
  return cx>=pauseBtn.x&&cx<=pauseBtn.x+pauseBtn.w&&cy>=pauseBtn.y&&cy<=pauseBtn.y+pauseBtn.h;
}

  for(const b of settingsBtns){

// Regex-based evasion detection (catches symbol substitution)
const NG_REGEX=[
  /f+[u\*@]+c+k/i,        // f**k variants
  /s+h+[i1!]+t/i,         // sh*t variants
  /n+[i1!]+g+[e3a@]+/i,   // n-word variants
  /c+[u\*]+n+t/i,         // c**t variants
  /d+[i1!]+c+k/i,         // d**k variants
  /p+[u\*]+s+s+y/i,       // p***y variants
  /b+[i1!]+t+c+h/i,       // b***h variants
  /r+[a@4]+p+[e3]+/i,     // r**e variants
  /a+s+s+h+o+l+e/i,       // a**hole variants
  /wh+[o0]+r+e/i,         // w***e variants
];
const NG_ALLOW=['かすみ','カスミ','霞'];
function containsNG(name){
  const low=name.toLowerCase().replace(/[\s\u3000\u00A0]/g,'');
  // Word list check
  for(const w of NG_WORDS){
    const wl=w.toLowerCase().replace(/[\s]/g,'');
    if(low.includes(wl)){
      let allowed=false;
      for(const a of NG_ALLOW){
        if(low.includes(a.toLowerCase())&&a.toLowerCase().includes(wl)){allowed=true;break}
      }
      if(!allowed)return true;
    }
  }
  // Regex evasion check
  const stripped=name.replace(/[\s\u3000\u00A0\-_\.]/g,'');
  for(const rx of NG_REGEX){
    if(rx.test(stripped))return true;
  }
  return false;
}
function sanitizeName(name){
  // Remove control characters (U+0000-U+001F, U+007F, U+200B-U+200F, U+FEFF etc.)
  return name.replace(/[\x00-\x1F\x7F\u200B-\u200F\u2028-\u202F\uFEFF]/g,'').trim().substring(0,8);
}

  try{const d=JSON.parse(localStorage.getItem('14b_comp'));if(d&&typeof d==='object'&&Array.isArray(d.a)&&d.a.length>0&&d.a.every(v=>typeof v==='string')){

function completeDie(){
  if(gameMode!=='complete')return false;
  completeLives--;

      rewardAdOffered=true;

}

let adBusy=false;

function showAdThenTitle(callback){

  adBusy=true;adLoadingTimer=fc;

// Rewarded ad: returns true if ad was offered, false if unavailable
function offerRewardedAd(onRewarded,onSkipped){
  if(adBusy)return false;
  if(window.adRemoved||typeof window.nativeShowRewardedAd!=='function'){return false}
  adBusy=true;adLoadingTimer=fc;
  const timer=setTimeout(()=>{adBusy=false;adLoadingTimer=0;if(onSkipped)onSkipped()},AD_TIMEOUT);
  window.nativeShowRewardedAd(
    ()=>{clearTimeout(timer);adBusy=false;adLoadingTimer=0;onRewarded()},
    ()=>{clearTimeout(timer);adBusy=false;adLoadingTimer=0;if(onSkipped)onSkipped()}

}

function update(){
  if(gs==='paused')return;
  fc++;if(gs==='dying'){deathTimer++;if(deathTimer===1){vib([50,30,50]);stopQuakeSe()}if(deathTimer===DEATH_BGM_DELAY){playBgm(bgmDeath)}if(deathTimer>=DEATH_FADE){
    if(gameMode==='challenge'){challengeScore=cB;showNameEntry=isRankIn(challengeScore);nameInput='';nameInputActive=showNameEntry}
    if(gameMode==='complete')clearCompleteProgress();
    gs='gameover';bL=false;bR=false}return}
  if(gs==='complete_hit'){completeHitTimer++;if(completeHitTimer===1)vib([30,20,30]);if(completeHitTimer>=COMPLETE_HIT_FADE){
    gs='playing';btTimer=BT_HALF*2;btLabel=tf('blockNum',1);btAction=()=>{cB=1;genA();sB();bL=false;bR=false;
      playBgm(stageBgms[Math.min(Math.floor(clearedAnomalies.length*6/AN.length),5)]);
      sM(t('returnedMsg'),tf('remainingLives',completeLives))}}return}
  if(gs==='revive_prompt')return;// freeze game, wait for user choice
  if(gs==='gameover'){if(deathTimer<DEATH_BGM_DELAY){deathTimer++;if(deathTimer===DEATH_BGM_DELAY){playBgm(bgmDeath)}}return}
  if(gs==='challenge_clear')return;
  if(gs==='complete_clear')return;
  if(gs!=='playing')return;
  if(mTm>0)mTm--;
  // [DEBUG OFF] if(debugTapTimer>0){debugTapTimer--;if(debugTapTimer===0)debugTapCount=0}
  // [DEBUG OFF] if(debugNotify>0)debugNotify--;
  // Block transition blackout timer
  if(btTimer>0){btTimer--;if(btTimer===BT_HALF&&btAction){const fn=btAction;btAction=null;fn();if(gs!=='playing'){btTimer=0}}return}
  if(tTm>0){tTm--;if(tTm===0){if(tTp==='a'){
    // Queue block advance with blackout transition
    const nb=cB+1;
    if(gameMode==='normal'&&nb>14){cB++;gs='clear';playBgm(bgmGoal);return}
    if(gameMode==='easy'&&nb>14){cB++;gs='easy_clear';playBgm(bgmGoal);return}
    if(gameMode==='challenge'&&nb>CHALLENGE_MAX){cB++;gs='challenge_clear';challengeScore=CHALLENGE_MAX;showNameEntry=true;nameInput='';nameInputActive=true;playBgm(bgmGoal);return}
    btLabel=tf('blockNum',nb);btAction=()=>{cB++;
      if(gameMode==='complete'&&clearedAnomalies.length>=AN.length){clearCompleteProgress();gs='complete_clear';playBgm(bgmGoal);return}
      // Challenge: cycle BGM by block count
      if(gameMode==='challenge'&&cB>=20&&cB%20===0){playBgm(stageBgms[(cB/20)%10])}
      // Complete: cycle BGM by cleared anomaly count (stage1-6 only)
      if(gameMode==='complete'){playBgm(stageBgms[Math.min(Math.floor(clearedAnomalies.length*6/AN.length),5)])}
      genA();sB();sM(tf('blockNum',cB))};btTimer=BT_HALF*2
  }else{
    if(gameMode==='challenge'){
      // Challenge mode: 1 miss = game over
      challengeScore=cB;lastDeathCause='misjudge';gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
      stopBgm();playSe(seMissSrc);return
    }
    // Normal & Complete: back to block 1 (complete keeps clearedAnomalies)
    if(gameMode==='complete'){
      lastDeathCause='misjudge';
      if(!completeDie()){
        gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
        stopBgm();playSe(seMissSrc);return
      }else{playSe(seMissSrc)}
    }else if(gameMode==='easy'){
      // イージー: 1番地分だけ戻す（全リセットしない救済）
      const back=Math.max(1,cB-1);
      btLabel=tf('blockNum',back);btAction=()=>{cB=back;genA();sB();bL=false;bR=false;sM(t('returnedMsgEasy'),t('misjudgeMsg'))};btTimer=BT_HALF*2
    }else{
      btLabel=tf('blockNum',1);btAction=()=>{cB=1;genA();sB();bL=false;bR=false;sM(t('returnedMsg'),t('misjudgeMsg'))};btTimer=BT_HALF*2
    }

let _deathOC=null,_deathW=0,_deathH=0;// cached edge-faded death image (rebuilt only on resize)
function dGameOver(){
  X.fillStyle='#0A0000';X.fillRect(0,0,W,H);
  // Blood drip effect - left side only
  for(let i=0;i<20;i++){
    const dx=((fc*0.3+i*73)%(W*0.5));
    const dy=((fc*0.5+i*131)%(H*0.6));
    X.fillStyle=`rgba(120,0,0,${0.15+Math.sin(fc*0.02+i)*0.1})`;
    X.fillRect(dx,0,2,dy);
  }
  // Vignette
  const vg=X.createRadialGradient(W/2,H/2,W*0.1,W/2,H/2,W*0.6);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,0.7)');
  X.fillStyle=vg;X.fillRect(0,0,W,H);
  // Draw death image - large, right-aligned with edge-fade mask
  if(deathImgOk){
    const ih=H*0.85;
    const iw=ih*(deathImg.naturalWidth/deathImg.naturalHeight);
    const ix=W*0.65-iw/2;
    const iy=H*0.5-ih/2;
    // Build edge-faded masked image once; reuse until screen size changes (avoids per-frame canvas alloc)
    if(!_deathOC||_deathW!==W||_deathH!==H){
      _deathOC=document.createElement('canvas');
      _deathOC.width=Math.ceil(iw);_deathOC.height=Math.ceil(ih);
      const ox=_deathOC.getContext('2d');
      // Draw image first
      ox.drawImage(deathImg,0,0,iw,ih);
      // Erase edges with destination-out gradients (4 sides)
      ox.globalCompositeOperation='destination-out';
      const fT=0.25,fB=0.25,fL=0.25,fR=0.25;// fade 25% on each edge
      const gT=ox.createLinearGradient(0,0,0,ih*fT);
      gT.addColorStop(0,'rgba(0,0,0,1)');gT.addColorStop(1,'rgba(0,0,0,0)');
      ox.fillStyle=gT;ox.fillRect(0,0,iw,ih*fT);
      const gB=ox.createLinearGradient(0,ih*(1-fB),0,ih);
      gB.addColorStop(0,'rgba(0,0,0,0)');gB.addColorStop(1,'rgba(0,0,0,1)');
      ox.fillStyle=gB;ox.fillRect(0,ih*(1-fB),iw,ih*fB);
      const gL=ox.createLinearGradient(0,0,iw*fL,0);
      gL.addColorStop(0,'rgba(0,0,0,1)');gL.addColorStop(1,'rgba(0,0,0,0)');
      ox.fillStyle=gL;ox.fillRect(0,0,iw*fL,ih);
      const gR=ox.createLinearGradient(iw*(1-fR),0,iw,0);
      gR.addColorStop(0,'rgba(0,0,0,0)');gR.addColorStop(1,'rgba(0,0,0,1)');
      ox.fillStyle=gR;ox.fillRect(iw*(1-fR),0,iw*fR,ih);
      ox.globalCompositeOperation='source-over';
      _deathW=W;_deathH=H;
    }
    // Draw cached masked result onto main canvas
    X.drawImage(_deathOC,ix,iy);
  }
  // === Flow-based layout (prevents overlap on any screen size) ===
  const cx=W*0.3,pulse=0.7+Math.sin(fc*0.06)*0.3;
  const dTx=ICN.text_dead;
  const dTw=Math.min(180,H*0.30);
  const dTh=(dTx&&dTx.complete&&dTx.naturalWidth)?dTw*(dTx.naturalHeight/dTx.naturalWidth):42;
  const gap=Math.max(6,H*0.025);
  const goScore=gameMode==='challenge'?challengeScore:cB;
  const hasName=gameMode==='challenge'&&showNameEntry;
  const hasCause=lastDeathCause&&window.adRemoved;
  const hasRank=!showNameEntry&&gameMode==='challenge'&&lastRankPos>0;
  // Calculate total content height for vertical centering
  let totalH=dTh+gap+20;// sprite + narrative
  if(hasName)totalH+=130+gap;
  if(gameMode==='challenge')totalH+=34+gap;
  if(hasCause)totalH+=18+gap;
  if(hasRank)totalH+=24+gap;
  let curY=Math.max(H*0.03,(H-totalH)/2);
  // 1. GAME OVER sprite
  if(dTx&&dTx.complete&&dTx.naturalWidth){
    X.save();X.shadowColor='#FF0000';X.shadowBlur=25*pulse;X.globalAlpha=pulse;
    X.drawImage(dTx,cx-dTw/2,curY,dTw,dTh);
    X.shadowBlur=0;X.globalAlpha=1;X.restore();
  }else{
    X.save();X.shadowColor='#FF0000';X.shadowBlur=20;
    X.fillStyle=`rgba(200,20,20,${pulse})`;X.font='bold 42px serif';X.textAlign='center';
    X.fillText(t('deathMsg'),cx,curY+dTh*0.8);
    X.shadowBlur=0;X.shadowColor='transparent';X.restore();
  }
  curY+=dTh+gap;
  // 2. Name entry (challenge mode)
  if(hasName){dNameEntry(cx,curY+10);syncNameElPos();curY+=130+gap}
  // 3. Death narrative
  X.fillStyle='#882222';X.font='16px sans-serif';X.textAlign='center';
  X.fillText(tf('deathNarr',goScore),cx,curY+16);curY+=22+gap;
  // 4. Challenge score emphasis
  if(gameMode==='challenge'){
    X.fillStyle='#CC6633';X.font='bold 28px serif';
    X.fillText(tf('deathScore',goScore),cx,curY+28);curY+=34+gap;
  }
  // 5. Death cause (ad removal only)
  if(hasCause){
    const causeNames={thug:t('deathThug'),creep:t('deathCreep'),wizard:t('deathWizard'),ghost:t('deathGhost'),alien:t('deathAlien'),evilFog:t('deathFog'),runnerPiyo:t('deathRunner'),bugaSphere:t('deathBugaSphere'),misjudge:t('deathJudge')};
    const cn=causeNames[lastDeathCause]||lastDeathCause;
    X.fillStyle='#664444';X.font='13px sans-serif';
    X.fillText(tf('deathCauseLabel',cn),cx,curY+13);curY+=18+gap;
  }
  // 6. Rank (challenge, after name entry)
  if(hasRank){
    X.fillStyle='#CC8844';X.font='bold 18px sans-serif';X.textAlign='center';
    X.fillText(tf('currentRank',lastRankPos),cx,curY+18);curY+=24+gap;
  }
  // 7. Tap to continue (bottom-anchored)
  if(!showNameEntry){
    const tapA=0.3+Math.sin(fc*0.05)*0.7;
    X.fillStyle=`rgba(150,80,80,${Math.max(0,tapA)})`;
    X.font='14px sans-serif';X.textAlign='center';
    X.fillText(t('tapToTitle'),cx,Math.max(curY+14,H*0.85));
  }
}

let _lastFrameTime=-1;
function loop(now){
  requestAnimationFrame(loop);
  if(_lastFrameTime<0){_lastFrameTime=now;return}
  if(now-_lastFrameTime<15)return;
  _lastFrameTime+=16.667;
  if(_lastFrameTime<now-16.667)_lastFrameTime=now;
  update();render();
}

function handleTitleTap(cx,cy){
  for(const b of titleBtns){
    if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){
      if(exitConfirm){
        if(b.id===200){exitApp()}
        else if(b.id===201){exitConfirm=false}
        return true;
      }
      if(compDeleteConfirm){
        if(b.id===101){clearCompleteProgress();compDeleteConfirm=false}
        else if(b.id===102){compDeleteConfirm=false}
        return true;
      }
      if(b.id===300){gs='settings';exitConfirm=false;playBgm(bgmSettings);return true}
      if(b.id===100){compDeleteConfirm=true;return true}
      if(b.id===0){startGame('normal')}
      else if(b.id===5){startGame('easy')}
      else if(b.id===1){startGame('complete')}
      else if(b.id===2){startGame('challenge')}
      else if(b.id===3){gs='ranking';rankScrollY=0;rankJustOpened=true;rankReportConfirm=null;rankReportedTimer=0;rankReportMode=false;playBgm(bgmRanking);loadRanking()}
      else if(b.id===4){gs='hints';hintsScrollY=0;hintsJustOpened=true}
      return true;
    }
  }
  if(exitConfirm)return true;// block taps outside exit dialog
  if(compDeleteConfirm)return true;// block taps outside dialog
  return false;
}
