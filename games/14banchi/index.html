// Pre-generate red-tinted sprites for runnerPiyo (avoid runtime creation & memory leak)
const RED_SPR={};
function initRedSprites(){
  const keys=['walk_0','stand','walk_2'];
  let pending=keys.length;
  keys.forEach(k=>{
    const img=SPR[k];
    function tryGen(){
      if(!img.complete||!img.naturalWidth||!img.naturalHeight){pending--;return;}
      const oc=document.createElement('canvas');
      oc.width=img.naturalWidth;oc.height=img.naturalHeight;
      const ox=oc.getContext('2d');
      ox.drawImage(img,0,0);
      const id=ox.getImageData(0,0,oc.width,oc.height);
      const d=id.data;
      for(let p=0;p<d.length;p+=4){
        if(d[p+3]<10)continue;
        d[p]=Math.min(255,d[p]+60);
        d[p+1]=Math.max(0,d[p+1]-70);
        d[p+2]=Math.min(255,d[p+2]+10);
      }
      ox.putImageData(id,0,0);
      RED_SPR[k]=oc;
    }
    if(img.complete&&img.naturalWidth)tryGen();
    else img.addEventListener('load',tryGen,{once:true});
  });
}

// === Web Audio API for SE ===
let actx=null;
const seBufs={};

function ensureACtx(){
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  }
  if(actx.state==='suspended'||actx.state==='interrupted'){
    try{actx.resume()}catch(e){}
  }
  return actx;
}

async function fetchAudioSafe(url){
  // Try fetch first (works on http/https), then XHR (works on file:// in some browsers)
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error(res.status);
    return res.arrayBuffer();
  }catch(e){}
  return new Promise((resolve,reject)=>{
    try{
      const xhr=new XMLHttpRequest();
      xhr.open('GET',url,true);xhr.responseType='arraybuffer';
      xhr.onload=()=>{if(xhr.response&&xhr.response.byteLength>0)resolve(xhr.response);else reject(new Error('XHR empty'))};
      xhr.onerror=()=>reject(new Error('XHR failed: '+url));
      xhr.send();
    }catch(e2){reject(e2)}
  });
}
let seLoadAttempts=0;
async function loadAllSE(){
  if(seLoaded)return;
  const ac=ensureACtx();if(!ac)return;
  seLoadAttempts++;
  try{
    const [goArr,missArr,quakeArr,heartArr]=await Promise.all([fetchAudioSafe('go.mp3'),fetchAudioSafe('miss.mp3'),fetchAudioSafe('quake.mp3'),fetchAudioSafe('heart.mp3')]);
    seBufs['go']=await ac.decodeAudioData(goArr);
    seBufs['miss']=await ac.decodeAudioData(missArr);
    seBufs['quake']=await ac.decodeAudioData(quakeArr);
    seBufs['heart']=await ac.decodeAudioData(heartArr);
    // Synthesize foghorn SE (eerie low horn)
    const fRate=ac.sampleRate;
    const fLen=2.0,fFrames=fLen*fRate;
    const fBuf=ac.createBuffer(1,fFrames,fRate);const fD=fBuf.getChannelData(0);
    for(let i=0;i<fFrames;i++){const t=i/fRate;const env=Math.min(t*2,1)*Math.max(0,1-t/fLen);fD[i]=env*(Math.sin(t*55*Math.PI*2)*0.3+Math.sin(t*82.5*Math.PI*2)*0.15+Math.sin(t*110*Math.PI*2)*0.1)*0.8}
    seBufs['foghorn']=fBuf;
    seLoaded=true;
  }catch(e){
    console.warn('SE load failed (attempt '+seLoadAttempts+'):', e.message||e);
    seLoaded=false;
    if(seLoadAttempts<3){setTimeout(loadAllSE,1000*seLoadAttempts)}
    else{
      // Final fallback: use Audio elements (works on file://)
      console.warn('SE: falling back to Audio elements');
      seFallback=true;seLoaded=true;
    }
  }
}

// === SE PLAYBACK ===
const seGoSrc='go';const seMissSrc='miss';
const seVols={'go':0.3,'miss':0.7,'quake':0.20,'foghorn':0.3,'heart':0.5};
const seFiles={'go':'go.mp3','miss':'miss.mp3','quake':'quake.mp3','heart':'heart.mp3'};
let seFallback=false;
// Track active quake SE source so it can be stopped on block transition
let quakeSrc=null;let quakeAudioFb=null;
function playSe(id){
  if(audioMuted)return;
  if(!seLoaded){loadAllSE();return}
  // Fallback mode: use Audio elements
  if(seFallback){
    const file=seFiles[id];if(!file)return;
    const a=new Audio(file);a.volume=seVols[id]||0.3;
    a.play().catch(()=>{});
    if(id==='quake'){if(quakeAudioFb){try{quakeAudioFb.pause()}catch(e){}}quakeAudioFb=a;a.onended=()=>{if(quakeAudioFb===a)quakeAudioFb=null}}
    return;
  }
  const ac=ensureACtx();if(!ac)return;
  const buf=seBufs[id];if(!buf)return;
  function doPlay(){
    try{
      const src=ac.createBufferSource();
      const gain=ac.createGain();
      src.buffer=buf;
      gain.gain.value=seVols[id]||0.3;
      src.connect(gain);gain.connect(ac.destination);
      src.start(0);
      if(id==='quake'){
        if(quakeSrc){try{quakeSrc.stop()}catch(e){}}
        quakeSrc=src;
        src.onended=()=>{if(quakeSrc===src)quakeSrc=null};
      }
    }catch(e){}
  }
  if(ac.state==='running'){doPlay()}
  else{try{ac.resume().then(()=>doPlay()).catch(()=>{})}catch(e){doPlay()}}
}
function stopQuakeSe(){
  if(quakeSrc){try{quakeSrc.stop()}catch(e){}quakeSrc=null}
  if(quakeAudioFb){try{quakeAudioFb.pause()}catch(e){}quakeAudioFb=null}
}

function dCk(cx,cy,t,s){X.save();X.translate(cx,cy+Math.sin(t)*3);X.scale(s,s);X.fillStyle='#FFEE55';X.beginPath();X.ellipse(0,0,10,9,0,0,Math.PI*2);X.fill();X.beginPath();X.arc(0,-7,7,0,Math.PI*2);X.fill();X.fillStyle='#1a1a1a';X.beginPath();X.arc(-2,-8,1.8,0,Math.PI*2);X.fill();X.fillStyle='#FF8C00';X.beginPath();X.moveTo(5,-7);X.lineTo(9,-6);X.lineTo(5,-5);X.closePath();X.fill();X.fillStyle='#FFD700';X.beginPath();X.ellipse(-7,-1,5,3.5,-0.4,0,Math.PI*2);X.fill();X.restore()}

function genA(){
  BW=BW_NORMAL;runnerActive=false;
  if(gameMode==='normal'){
    if(cB<=1||cB>=14){hasA=false;return}
    hasA=Math.random()<0.55;
  }else if(gameMode==='complete'){
    if(cB<=1){hasA=false;return}
    hasA=Math.random()<0.75;
  }else{
    if(cB<=1){hasA=false;return}
    // Challenge difficulty curve: ramps up as blocks progress
    const chRate=cB<=50?0.45:cB<=150?0.55:cB<=300?0.65:0.75;
    hasA=Math.random()<chRate;
  }
  if(hasA){
    if(gameMode==='normal'||gameMode==='complete'){
      // Exclude already-cleared anomalies
      const available=[];
      for(let i=0;i<AN.length;i++){if(!clearedAnomalies.includes(AN[i]))available.push(i)}
      if(available.length===0){hasA=false;return}// All anomalies cleared
      aT=available[Math.floor(Math.random()*available.length)];
    }else{
      aT=Math.floor(Math.random()*AN.length);
    }
    if(AN[aT]==='shortBlock')BW=BW_SHORT;
    if(AN[aT]==='runnerPiyo'){runnerX=bsX+BW+100;runnerActive=true}
  }
  // Heart item drop (complete mode only, 1/15 chance, not on block 1)
  heartItemActive=false;
  if(gameMode==='complete'&&cB>1&&completeLives<getMaxLives()&&Math.random()<1/15){
    heartItemX=bsX+200+Math.random()*(BW-400);heartItemActive=true;
  }
}

function dSky(){

  if(hasA&&AN[aT]==='redSky'){c1=`rgb(${30+Math.sin(fc*0.04)*15|0},4,8)`;c2='#1A0508'}
  const g=X.createLinearGradient(0,0,0,H*GH);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(0,0,W,H*GH);
  if(!(hasA&&AN[aT]==='missingStars')){
    X.fillStyle='#FFF';for(const s of stars){const sx=((s.x-camX*0.05)%W+W)%W;X.globalAlpha=0.35+Math.sin(fc*0.02+s.b*10)*0.3;X.fillRect(sx,s.y*H,s.s,s.s)}X.globalAlpha=1
  }
  if(hasA&&AN[aT]==='giantMoon'){
    const mx=W*0.8,my=H*0.12,mr=48+Math.sin(fc*0.015)*5;
    const mg=X.createRadialGradient(mx,my,0,mx,my,mr);mg.addColorStop(0,'#CC2200');mg.addColorStop(0.5,'#881100');mg.addColorStop(1,'transparent');
    X.fillStyle=mg;X.beginPath();X.arc(mx,my,mr,0,Math.PI*2);X.fill();
  }else{
    const mx=W*0.85,my=H*0.1,mr=15;
    const mg=X.createRadialGradient(mx-2,my-2,0,mx,my,mr);mg.addColorStop(0,'#EEEEDD');mg.addColorStop(0.8,'#AAAA88');mg.addColorStop(1,'transparent');
    X.fillStyle=mg;X.beginPath();X.arc(mx,my,mr,0,Math.PI*2);X.fill();
    if(hasA&&AN[aT]==='wrongMoon'){
      X.fillStyle='rgba(60,60,40,0.5)';
      X.beginPath();X.arc(mx-4,my-3,2.5,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(mx+4,my-3,2.5,0,Math.PI*2);X.fill();
      X.strokeStyle='rgba(60,60,40,0.5)';X.lineWidth=1;
      X.beginPath();X.arc(mx,my+2,5,0.15*Math.PI,0.85*Math.PI);X.stroke();
    }
  }
  // redStar anomaly - a few faint red stars
  if(hasA&&AN[aT]==='redStar'){
    const rStars=[[W*0.15,H*0.08],[W*0.45,H*0.05],[W*0.7,H*0.14],[W*0.3,H*0.18],[W*0.55,H*0.12],[W*0.82,H*0.06]];
    X.fillStyle='#FF3C3C';for(const rs of rStars){

      X.beginPath();X.arc(rs[0],rs[1],1.2,0,Math.PI*2);X.fill();

}

function handlePauseTap(cx,cy){
  for(const b of pauseBtns){
    if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){
      if(b.id===0){gs='playing';retireConfirm=false;return true}// Resume
      if(b.id===20){toggleMute();return true}// Mute toggle
      if(b.id===1){retireConfirm=true;return true}// Show retire confirmation
      if(b.id===10){retireConfirm=false;gs='title';playBgm(bgmTitle);return true}// Confirm retire
      if(b.id===11){retireConfirm=false;return true}// Cancel retire
    }
  }
  return false;
}

function hitPauseBtn(cx,cy){
  return cx>=pauseBtn.x&&cx<=pauseBtn.x+pauseBtn.w&&cy>=pauseBtn.y&&cy<=pauseBtn.y+pauseBtn.h;
}

const BACK_X=-750;// back gate position relative to bsX
// Complete mode: consume life, return true if handled (not game over)
let completeHitTimer=0;
const COMPLETE_HIT_FADE=50;// frames of red fade before resetting
let rewardAdOffered=false;// prevent offering reward ad multiple times per game

// === COMPLETE MODE SAVE/LOAD ===
function saveCompleteProgress(){
  try{localStorage.setItem('14b_comp',JSON.stringify({a:clearedAnomalies,l:completeLives}))}catch(e){}
}
function loadCompleteProgress(){
  try{const d=JSON.parse(localStorage.getItem('14b_comp'));if(d&&Array.isArray(d.a)&&d.a.length>0){
    clearedAnomalies=d.a;completeLives=typeof d.l==='number'?d.l:getMaxLives();
    if(completeLives<=0){clearCompleteProgress();return false}// died last session
    return true;
  }}catch(e){}return false;
}
function clearCompleteProgress(){try{localStorage.removeItem('14b_comp')}catch(e){}}
function completeDie(){
  if(gameMode!=='complete')return false;
  completeLives--;
  saveCompleteProgress();// save immediately on every life loss (anti-exploit)
  if(completeLives<=0){
    // Last life lost: offer rewarded ad to revive (once per game)
    if(!rewardAdOffered){
      rewardAdOffered=true;
      bL=false;bR=false;pMov=false;
      const offered=offerRewardedAd(
        ()=>{// Rewarded: restore 2 lives and continue
          completeLives=2;saveCompleteProgress();
          gs='complete_hit';completeHitTimer=0;
        },
        ()=>{// Skipped/failed: die normally
          gs='dying';deathTimer=0;
          stopBgm();playSe(seMissSrc);
        }
      );
      if(offered){gs='complete_hit';completeHitTimer=0;return true}
    }
    return false;// no ad available or already offered, die normally
  }
  // Start red fade animation, then reset to block 1
  gs='complete_hit';completeHitTimer=0;bL=false;bR=false;pMov=false;
  return true;// handled, skip dying
}

// === AD HOOK ===
// Native wrapper provides: window.showInterstitialAd(onDismiss)
//                          window.nativeShowRewardedAd(onRewarded, onSkipped)
//                          window.adRemoved = true  (ad removal purchase flag)
//                          window.livesUpgrade = true  (lives pack purchase flag)
let adBusy=false;
let adLoadingTimer=0;
const AD_TIMEOUT=15000;// 15s timeout for hung ads

function showAdThenTitle(callback){
  if(adBusy)return;
  if(window.adRemoved||typeof window.showInterstitialAd!=='function'){
    callback();return;
  }
  adBusy=true;adLoadingTimer=fc;
  const timer=setTimeout(()=>{adBusy=false;adLoadingTimer=0;callback()},AD_TIMEOUT);
  window.showInterstitialAd(()=>{clearTimeout(timer);adBusy=false;adLoadingTimer=0;callback()});
}

// Rewarded ad: returns true if ad was offered, false if unavailable
function offerRewardedAd(onRewarded,onSkipped){
  if(adBusy)return false;
  if(window.adRemoved||typeof window.nativeShowRewardedAd!=='function'){return false}
  adBusy=true;adLoadingTimer=fc;
  const timer=setTimeout(()=>{adBusy=false;adLoadingTimer=0;if(onSkipped)onSkipped()},AD_TIMEOUT);
  window.nativeShowRewardedAd(
    ()=>{clearTimeout(timer);adBusy=false;adLoadingTimer=0;onRewarded()},

function update(){
  if(gs==='paused')return;
  fc++;if(gs==='dying'){deathTimer++;if(deathTimer===1)vib([50,30,50]);if(deathTimer===DEATH_BGM_DELAY){playBgm(bgmDeath)}if(deathTimer>=DEATH_FADE){
    if(gameMode==='challenge'){challengeScore=cB;showNameEntry=isRankIn(challengeScore);nameInput='';nameInputActive=showNameEntry}
    if(gameMode==='complete')clearCompleteProgress();
    gs='gameover';bL=false;bR=false}return}
  if(gs==='complete_hit'){completeHitTimer++;if(completeHitTimer===1)vib([30,20,30]);if(completeHitTimer>=COMPLETE_HIT_FADE){
    gs='playing';cB=1;genA();sB();sM('1番地に戻された…',`残りライフ: ${completeLives}`)}return}
  if(gs==='gameover'){if(deathTimer<DEATH_BGM_DELAY){deathTimer++;if(deathTimer===DEATH_BGM_DELAY){playBgm(bgmDeath)}}return}
  if(gs==='challenge_clear')return;
  if(gs==='complete_clear')return;
  if(gs!=='playing')return;
  if(mTm>0)mTm--;
  if(debugTapTimer>0){debugTapTimer--;if(debugTapTimer===0)debugTapCount=0}
  if(debugNotify>0)debugNotify--;
  if(tTm>0){tTm--;if(tTm===0){if(tTp==='a'){
    cB++;
    if(gameMode==='normal'&&cB>14){gs='clear';playBgm(bgmGoal);return}
    if(gameMode==='challenge'&&cB>CHALLENGE_MAX){gs='challenge_clear';challengeScore=CHALLENGE_MAX;showNameEntry=true;nameInput='';nameInputActive=true;playBgm(bgmGoal);return}
    if(gameMode==='complete'&&clearedAnomalies.length>=AN.length){clearCompleteProgress();gs='complete_clear';playBgm(bgmGoal);return}
    genA();sB();sM(`${cB}番地`)
  }else{
    if(gameMode==='challenge'){
      // Challenge mode: 1 miss = game over
      challengeScore=cB;lastDeathCause='異変の判断ミス';gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
      stopBgm();playSe(seMissSrc);return
    }
    // Normal & Complete: back to block 1 (complete keeps clearedAnomalies)
    if(gameMode==='complete'){
      lastDeathCause='異変の判断ミス';
      if(!completeDie()){
        gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
        stopBgm();playSe(seMissSrc);return
      }else{playSe(seMissSrc)}
    }else{
      cB=1;genA();sB();sM('1番地に戻された…','異変の判断を間違えた')
    }
  }}return}
  if(skT>0){skT--;skX=(Math.random()-0.5)*skT*0.7;skY=(Math.random()-0.5)*skT*0.4}else if(!(hasA&&AN[aT]==='earthquake')){skX=0;skY=0}
  const sp=debugMode===2?12:4;pMov=false;
  if(bR){pX+=sp;pDir=1;pMov=true}

  camX+=(pX-W*0.35-camX)*0.1;
  // Heart item pickup
  if(heartItemActive&&Math.abs(pX-heartItemX)<30){
    heartItemActive=false;
    if(completeLives<getMaxLives()){completeLives++;saveCompleteProgress();playSe('heart');vib(10);sM('❤️ ライフ回復！',`ライフ: ${completeLives}/${getMaxLives()}`)}
  }
  // === COLLISION CHECK with killer anomalies ===
  if(hasA&&tTm===0){
    const killTypes=['thug','creep','wizard','ghost'];
    const a=AN[aT];
    if(killTypes.includes(a)){
      let ex=0;
      if(a==='thug')ex=bsX+BW*0.5;
      else if(a==='creep')ex=bsX+BW*0.55;
      else if(a==='wizard')ex=bsX+BW*0.45;
      else if(a==='ghost')ex=bsX+BW*0.5;
      const dist=Math.abs(pX-ex);
      if(dist<40){
        lastDeathCause=a;
        if(!completeDie()){
          gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
          stopBgm();playSe(seMissSrc);
        }else{playSe(seMissSrc)}
      }
    }
    // evilFog collision - fog wall position
    if(a==='evilFog'&&efStart!==null){
      const elapsed=fc-efStart;
      const fogDelay=120;
      if(elapsed>fogDelay){
        const fogX=bsX+BW+200-(elapsed-fogDelay)*4.1;
        if(pX>fogX-20){
          lastDeathCause='evilFog';

            gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
            stopBgm();playSe(seMissSrc);
          }else{playSe(seMissSrc)}
        }
      }
    }
    // runnerPiyo collision - another piyo running at you (faster than player)
    if(a==='runnerPiyo'&&runnerActive){
      runnerX-=4.3;
      if(Math.abs(pX-runnerX)<30){
        lastDeathCause='runnerPiyo';
        if(!completeDie()){
          gs='dying';deathTimer=0;bL=false;bR=false;pMov=false;
          stopBgm();playSe(seMissSrc);
        }else{playSe(seMissSrc)}
      }
    }
  }
  if(pX<bsX+BACK_X){pX=bsX+BACK_X;if(hasA){if((gameMode==='normal'||gameMode==='complete')&&!clearedAnomalies.includes(AN[aT])){clearedAnomalies.push(AN[aT]);if(gameMode==='complete')saveCompleteProgress()}tTp='a';tTm=30;playSe(seGoSrc);vib(10);sM('異変を発見！正解！','引き返して正解だった')}else{tTp='r';tTm=40;skT=18;playSe(seMissSrc);vib([30,20,30]);sM('異変は無かった…！','正常な道で引き返してしまった')}}
  if(pX>bsX+BW+30){if(hasA){tTp='r';tTm=40;skT=18;playSe(seMissSrc);vib([30,20,30]);sM('異変を見逃した…！','よく観察しよう')}else{tTp='a';tTm=30;playSe(seGoSrc);vib(10);sM('正解！前進成功！')}}
  if(pMov){pAT++;if(pAT>6){pAT=0;pFr=(pFr+1)%4}}else{pFr=0;pAT=0}
}

        if(b.id===101){clearCompleteProgress();compDeleteConfirm=false}

        return true;
      }
      if(b.id===300){gs='settings';return true}
      if(b.id===100){compDeleteConfirm=true;return true}
      if(b.id===0){startGame('normal')}

      else if(b.id===2){startGame('challenge')}
      else if(b.id===3){gs='ranking';playBgm(bgmRanking);loadRanking()}
      else if(b.id===4){gs='hints';hintsScrollY=0;hintsJustOpened=true}
      return true;
    }
  }
  if(compDeleteConfirm)return true;// block taps outside dialog
  return false;
}

  }
  if(gs==='dying'||gs==='complete_hit')return;

  const cx0=(ts[0].clientX-rc.left)*(W/rc.width);
  const cy0=(ts[0].clientY-rc.top)*(H/rc.height);

  if(gs==='hints'&&hintsDragging){
    if(!e.touches||!e.touches.length)return;
    const rc=C.getBoundingClientRect();
    const ty=(e.touches[0].clientY-rc.top)*(H/rc.height);
    const dy=hintsTouchStartY-ty;
    hintsScrollY+=dy;
    hintsTotalDrag+=Math.abs(dy);
    hintsTouchStartY=ty;return;
  }
  if(gs!=='playing')return;bL=false;bR=false;const rc=C.getBoundingClientRect();if(e.touches)for(let t of e.touches){if((t.clientX-rc.left)<W*0.4)bL=true;else bR=true}}
function hE(e){e.preventDefault();lastTouchTime=Date.now();
  if(gs==='hints'){
    const wasDrag=hintsDragging&&hintsTotalDrag>10;
    hintsDragging=false;
    if(hintsJustOpened){hintsJustOpened=false;return}// ignore touchend from the tap that opened hints
    // Only process tap (back button) if user didn't scroll
    if(!wasDrag&&e.changedTouches&&e.changedTouches.length>0){
      const rc=C.getBoundingClientRect();
      const hy=(e.changedTouches[0].clientY-rc.top)*(H/rc.height);
      if(hy>=H*0.89){gs='title'}
    }
    return;
  }
  if(e.touches&&e.touches.length>0)uT(e);else{bL=false;bR=false}}
C.addEventListener('touchstart',hS,{passive:false});C.addEventListener('touchmove',uT,{passive:false});C.addEventListener('touchend',hE,{passive:false});C.addEventListener('touchcancel',hE,{passive:false});
  
C.addEventListener('mousedown',(e)=>{
  if(isGhostMouse())return;
  e.preventDefault();touchResume();
  if(gs==='tap'){unlockAudio();gs='title';playBgm(bgmTitle);return}
  if(gs==='title'){const rc=C.getBoundingClientRect();const cx=(e.clientX-rc.left)*(W/rc.width);const cy=(e.clientY-rc.top)*(H/rc.height);handleTitleTap(cx,cy);return}
  if(gs==='ranking'){gs='title';playBgm(bgmTitle);return}
  if(gs==='settings'){const rc7=C.getBoundingClientRect();const scx2=(e.clientX-rc7.left)*(W/rc7.width),scy2=(e.clientY-rc7.top)*(H/rc7.height);handleSettingsTap(scx2,scy2);return}
  if(gs==='hints'){const rc5=C.getBoundingClientRect();const my5=(e.clientY-rc5.top)*(H/rc5.height);if(my5>=H*0.89){gs='title'}return}
  if(gs==='clear'){
    const rc6=C.getBoundingClientRect();const mcx6=(e.clientX-rc6.left)*(W/rc6.width),mcy6=(e.clientY-rc6.top)*(H/rc6.height);
    for(const b of clearBtns){if(mcx6>=b.x&&mcx6<=b.x+b.w&&mcy6>=b.y&&mcy6<=b.y+b.h){
      if(b.id==='replay'){showAdThenTitle(()=>startGame('normal'));return}
      if(b.id==='title'){showAdThenTitle(goToTitle);return}
    }}return;
  }
  if(gs==='complete_clear'){showAdThenTitle(goToTitle);return}
  if(gs==='challenge_clear'){
    if(showNameEntry){const rc4=C.getBoundingClientRect();const mx2=(e.clientX-rc4.left)*(W/rc4.width);const my2=(e.clientY-rc4.top)*(H/rc4.height);if(hitNameOkBtn(mx2,my2))handleNameOK();else if(hitNameInputArea(mx2,my2))openNameInput();return}
    showAdThenTitle(goToTitle);return;
  }
  if(gs==='gameover'){
    if(showNameEntry){
      const rc3=C.getBoundingClientRect();
      const mx=(e.clientX-rc3.left)*(W/rc3.width);
      const my=(e.clientY-rc3.top)*(H/rc3.height);
      if(hitNameOkBtn(mx,my))handleNameOK();
      else if(hitNameInputArea(mx,my))openNameInput();
      return;
    }
    showAdThenTitle(goToTitle);return;
  }
  if(gs==='dying'||gs==='complete_hit')return;
  const rc2=C.getBoundingClientRect();
  const mcx=(e.clientX-rc2.left)*(W/rc2.width);
  const mcy=(e.clientY-rc2.top)*(H/rc2.height);
  if(gs==='paused'){handlePauseTap(mcx,mcy);return}
  if(gs==='playing'&&mcx>=W/2-80&&mcx<=W/2+80&&mcy>=saT&&mcy<=saT+50){
    debugTapCount++;debugTapTimer=300;
    if(debugTapCount>=10){debugMode=(debugMode+1)%3;debugTapCount=0;debugTapTimer=0;debugNotify=120}
    return;
  }
  if(gs==='playing'&&hitPauseBtn(mcx,mcy)){gs='paused';bL=false;bR=false;retireConfirm=false;return}
  if(mcx<W*0.4)bL=true;else bR=true;
});
C.addEventListener('wheel',(e)=>{
  if(gs==='hints'){e.preventDefault();hintsScrollY+=e.deltaY*0.5}
},{passive:false});
C.addEventListener('mouseup',()=>{if(!isGhostMouse()){bL=false;bR=false}});C.addEventListener('mouseleave',()=>{if(!isGhostMouse()){bL=false;bR=false}});

// Hidden input for mobile keyboard
const nameEl=document.createElement('input');nameEl.type='text';nameEl.maxLength=8;
nameEl.setAttribute('autocomplete','off');nameEl.setAttribute('autocorrect','off');
nameEl.setAttribute('autocapitalize','off');nameEl.setAttribute('spellcheck','false');
nameEl.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);opacity:0.01;font-size:16px;width:1px;height:1px;border:none;z-index:10000;';
document.body.appendChild(nameEl);
nameEl.addEventListener('input',()=>{nameInput=nameEl.value.substring(0,8)});
nameEl.addEventListener('blur',()=>{nameInputActive=false});
function openNameInput(){
  nameEl.value=nameInput;nameInputActive=true;
  // iOS requires focus in user gesture context; use setTimeout as fallback
  try{nameEl.focus()}catch(e){}
  setTimeout(()=>{try{nameEl.focus()}catch(e){}},50);
}

document.addEventListener('keydown',(e)=>{
  if(nameInputActive){
    if(e.key==='Enter')handleNameOK();
    return;
  }
  if(gs==='dying'||gs==='complete_hit')return;
  if(e.key==='ArrowRight'||e.key==='d')bR=true;
  if(e.key==='ArrowLeft'||e.key==='a')bL=true;
  if(gs==='playing'&&(e.key==='Escape'||e.key==='p')){gs='paused';bL=false;bR=false;retireConfirm=false;return}
  if(gs==='paused'){
    if(e.key==='Escape'||e.key==='p'||e.key==='Enter'){gs='playing';return}
    if(e.key==='q'){gs='title';playBgm(bgmTitle);return}
    return;
  }
  if(gs==='tap'){unlockAudio();gs='title';playBgm(bgmTitle)}
  else if(gs==='title'){
    if(e.key==='1'){startGame('normal')}
    else if(e.key==='2'){startGame('complete')}
    else if(e.key==='3'){startGame('challenge')}
    else if(e.key==='4'){gs='ranking';playBgm(bgmRanking);loadRanking()}
    else if(e.key==='5'){gs='hints';hintsScrollY=0;hintsJustOpened=true}
  }
  else if(gs==='ranking'){gs='title';playBgm(bgmTitle)}
  else if(gs==='settings'){gs='title'}
  else if(gs==='hints'){gs='title'}
  else if(gs==='clear'||gs==='challenge_clear'||gs==='complete_clear'||gs==='gameover'){
    if(!showNameEntry){showAdThenTitle(goToTitle)}
  }
});
document.addEventListener('keyup',(e)=>{if(e.key==='ArrowRight'||e.key==='d')bR=false;if(e.key==='ArrowLeft'||e.key==='a')bL=false});
// === PWA: Service Worker ===
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

loop();
</script>
