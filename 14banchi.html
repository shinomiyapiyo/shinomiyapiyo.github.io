    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #14141c;
            --panel-border: rgba(255,255,255,0.08);
            --indigo: #6366f1;
            --indigo-light: #a5b4fc;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --warn-bg: rgba(245, 158, 11, 0.08);
            --warn-border: rgba(245, 158, 11, 0.5);
            --warn-text: #fcd34d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            background-image:
                linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(99,102,241,0.12), transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text);
            font-family: 'Zen Maru Gothic', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 60rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8125rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--indigo-light); }

        .hero {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }
        .hero__icon {
            width: 5rem;
            height: 5rem;
            border-radius: 1.25rem;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 30px rgba(99,102,241,0.25);
            flex-shrink: 0;
        }
        .hero__title {
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1.3;
        }
        .hero__sub {
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-top: 0.25rem;
        }

        h1.section-h {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.02em;
        }
        .divider {
            height: 1px;
            background: var(--panel-border);
            margin: 1rem 0 2rem;
        }

        .store-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        @media (max-width: 640px) {
            .store-grid { grid-template-columns: 1fr; }
            .hero { flex-direction: column; text-align: center; }
            h1.section-h { font-size: 1.625rem; }
        }

        .store-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 1.25rem;
            padding: 1.75rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .store-card__label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            margin-bottom: 1.25rem;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #000;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 0.85rem;
            padding: 0.7rem 1.4rem;
            text-decoration: none;
            color: #fff;
            width: fit-content;
            transition: transform 0.15s, border-color 0.2s;
        }
        .store-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.4);
        }
        .store-btn svg { flex-shrink: 0; }
        .store-btn__text { text-align: left; line-height: 1.15; }
        .store-btn__top { font-size: 0.625rem; display: block; opacity: 0.85; }
        .store-btn__bottom { font-size: 1.125rem; font-weight: 700; display: block; }

        .warn {
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
            font-size: 0.8125rem;
            color: var(--warn-text);
            margin-bottom: 1.25rem;
            line-height: 1.55;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8125rem;
            color: var(--text-dim);
            text-align: center;
        }
        .footer-note a { color: var(--indigo-light); }
